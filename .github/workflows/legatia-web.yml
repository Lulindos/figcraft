# LegatIA: keeps the `legatia` branch on FigCraft's latest release and publishes the web build.
#
# sync  - every day (and on demand): when storytold/figcraft has a newer release than LEGATIA_BASE,
#         replays the LegatIA commits on top of it (git rebase --onto). On a conflict nothing is
#         published: an issue says which release and the branch stays where it was.
# build - builds the web version like FigCraft's own release (trunk, craft-fonts, craft-i18n) and
#         publishes it as a release `<base>-legatia.<run>` with the zip and its SHA-256.
#         LegatIAdm pins one of these in figcraft.web.json.
# See LEGATIA.md.
name: LegatIA web

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "FigCraft release to move to (e.g. v0.13.0). Empty: the latest"
        required: false
        default: ""
  schedule:
    - cron: "17 9 * * *" # 06:17 in Brasília
  push:
    branches: [legatia]
    paths-ignore: ["**.md"]

permissions:
  contents: write
  issues: write

concurrency:
  group: legatia-web
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.sync.outputs.base }}
      build: ${{ steps.sync.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legatia
          fetch-depth: 0
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name "legatia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/storytold/figcraft.git
          git fetch --quiet --tags --force upstream
          base=$(tr -d '[:space:]' < LEGATIA_BASE)
          latest=${WANT:-$(gh release view --repo storytold/figcraft --json tagName -q .tagName)}
          build=false
          if [ "$latest" != "$base" ]; then
            echo "FigCraft $latest is out (LegatIA is on $base): replaying the LegatIA commits"
            if git rebase --onto "$latest" "$base" legatia; then
              echo "$latest" > LEGATIA_BASE
              git commit -qam "LegatIA: base $latest"
              git push --force-with-lease origin legatia
              base=$latest
              build=true
            else
              git rebase --abort
              title="LegatIA: conflito ao atualizar para o FigCraft $latest"
              if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
                gh issue create --title "$title" --body "O FigCraft $latest mexeu nas mesmas linhas que as personalizações da LegatIA (branch \`legatia\`, base $base). Nada foi publicado: a LegatIA continua na versão anterior.

          Para resolver: \`git rebase --onto $latest $base legatia\`, resolver os conflitos (as personalizações ficam em \`crates/ui-egui/src/legatia.rs\` e nas poucas linhas que chamam ele, ver LEGATIA.md), atualizar LEGATIA_BASE e dar push. O build roda sozinho."
              fi
              echo "::warning::conflict replaying LegatIA on $latest; issue opened, nothing published"
            fi
          elif [ "$EVENT" != "schedule" ]; then
            # A push to legatia (a LegatIA change) or a manual run: build the same base again
            build=true
          elif [ -z "$(gh release list --limit 100 --json tagName -q ".[] | select(.tagName | startswith(\"${base}-legatia\")) | .tagName")" ]; then
            # Nothing published for this base yet
            build=true
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: needs.sync.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: legatia
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: legatia-web
      - uses: storytold/craft-common-actions/actions/install-trunk@main
      - name: Pin craft-fonts like FigCraft's own release
        id: fonts
        run: echo "ref=$(grep -oP 'craft-fonts-ref:\s*\K[0-9a-f]{40}' .github/workflows/release.yml)" >> "$GITHUB_OUTPUT"
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ steps.fonts.outputs.ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Build and zip
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.sync.outputs.base }}
        run: |
          set -euo pipefail
          tag="${BASE}-legatia.${{ github.run_number }}"
          zip=$(ls dist/release/figcraft-web-*.zip | head -1)
          out="dist/release/figcraft-web-${tag#v}.zip"
          mv "$zip" "$out"
          (cd dist/release && sha256sum "$(basename "$out")" > SHA256SUMS.txt)
          sha=$(cut -d' ' -f1 dist/release/SHA256SUMS.txt)
          gh release create "$tag" "$out" dist/release/SHA256SUMS.txt \
            --target "$(git rev-parse HEAD)" \
            --title "LegatIA Design ${tag}" \
            --notes "Versão web do FigCraft ${BASE} com a cara da LegatIA (branch \`legatia\`).

          Para usar no LegatIAdm, em \`figcraft.web.json\`:
          \`\`\`json
          { \"version\": \"${tag#v}\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/${tag}/$(basename "$out")\", \"sha256\": \"${sha}\" }
          \`\`\`"
